[unix_http_server]
file=/run/supervisor.sock
chmod=0700

[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisord.log
logfile_maxbytes=50MB
logfile_backups=10
loglevel=info
pidfile=/run/supervisord.pid
childlogdir=/var/log/supervisor

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[program:mysqld]
; Initializes the datadir/schema on first boot, then execs mysqld.
command=/usr/local/bin/start-mysql.sh
priority=1
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/mysqld.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10
stderr_logfile=/var/log/mysqld-error.log
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=10

[program:portal-bootstrap]
; Waits for MySQL, runs migrations/seed, then releases php-fpm and nginx.
command=/usr/local/bin/portal-bootstrap.sh
priority=10
autostart=true
autorestart=false
startsecs=0
stdout_logfile=/var/log/portal-bootstrap.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10
stderr_logfile=/var/log/portal-bootstrap-error.log
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=10

[program:php-fpm]
command=/usr/sbin/php-fpm8.2 -F
priority=20
autostart=false
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/php-fpm.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10
stderr_logfile=/var/log/php-fpm-error.log
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=10

[program:nginx]
command=nginx -g "daemon off;"
priority=30
autostart=false
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/nginx.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10
stderr_logfile=/var/log/nginx-error.log
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=10
