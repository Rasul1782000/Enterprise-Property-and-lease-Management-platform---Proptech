name: property-lease-monitoring

services:
  jenkins:
    image: gaarbejana-jenkins:local
    build:
      context: ..
      dockerfile: Dockerfile
      target: jenkins
    container_name: jenkins-server
    restart: unless-stopped
    ports:
      - "127.0.0.1:${JENKINS_PORT:-8888}:8080"
    volumes:
      - jenkins-home:/var/jenkins_home
      - //var/run/docker.sock:/var/run/docker.sock
    environment:
      JENKINS_ADMIN_PASSWORD: "${JENKINS_ADMIN_PASSWORD:?Set JENKINS_ADMIN_PASSWORD in frontend/deployment/monitoring/.env}"
      JAVA_OPTS: "-Djenkins.install.runSetupWizard=false"
      CASC_JENKINS_CONFIG: "/etc/jenkins/casc.yaml"
      JENKINS_OPTS: "--httpPort=8080"
    networks:
      - monitoring
      - api
    deploy:
      resources:
        limits:
          memory: 2G

networks:
  monitoring:
  api:
    external: true
    name: ${API_NETWORK:-deployment_default}

volumes:
  jenkins-home:
