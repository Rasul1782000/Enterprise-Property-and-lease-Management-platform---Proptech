services:
  app:
    image: gaarbejana-api:local
    build:
      context: ../..
      dockerfile: frontend/deployment/Dockerfile.backend
    environment:
      APP_ENV: local
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?Set APP_KEY in frontend/deployment/.env}
      APP_URL: http://127.0.0.1:${API_PORT:-8000}
      FRONTEND_URL: http://localhost:4200
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: property_lease
      DB_USERNAME: property_lease
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in frontend/deployment/.env}
      MAIL_MAILER: log
      MAIL_FROM_ADDRESS: noreply@propertylease.test
      CACHE_DRIVER: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      FILESYSTEM_DISK: documents
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      AWS_ENDPOINT_URL: http://floci:4566
      AWS_STORAGE_BUCKET: gaarbejana-documents
      AWS_STORAGE_PREFIX: portal
      AWS_USE_PATH_STYLE_ENDPOINT: "true"
      DEMO_SEED_ENABLED: ${DEMO_SEED_ENABLED:-false}
      LOG_CHANNEL: stderr
    volumes:
      - app-storage:/var/www/html/storage
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      floci:
        condition: service_started
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in frontend/deployment/.env}
      MYSQL_DATABASE: property_lease
      MYSQL_USER: property_lease
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in frontend/deployment/.env}
      GRAFANA_MYSQL_PASSWORD: ${GRAFANA_MYSQL_PASSWORD:?Set GRAFANA_MYSQL_PASSWORD in frontend/deployment/.env}
    volumes:
      - db-data:/var/lib/mysql
      - ./monitoring/mysql/init-grafana-reader.sh:/docker-entrypoint-initdb.d/20-grafana-reader.sh:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 128M

  floci:
    image: floci/floci:latest
    volumes:
      - floci-data:/app/data
    ports:
      - "127.0.0.1:4566:4566"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M

  floci-ui:
    image: floci/floci-ui:latest
    environment:
      FLOCI_ENDPOINT: http://floci:4566
      FLOCI_AZ_ENDPOINT: http://floci-azure:4577
      FLOCI_GCP_ENDPOINT: http://floci-gcp:4588
      FLOCI_OCI_ENDPOINT: http://floci-oracle:4599
    ports:
      - "127.0.0.1:4500:4500"
    depends_on:
      floci:
        condition: service_started
      floci-azure:
        condition: service_started
      floci-gcp:
        condition: service_started
      floci-oracle:
        condition: service_started
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M

  floci-azure:
    image: floci/floci-az:latest
    container_name: floci-1-azure
    volumes:
      - floci-azure-data:/app/data
    ports:
      - "127.0.0.1:4577:4577"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M

  floci-gcp:
    image: floci/floci-gcp:latest
    container_name: floci-1-gcp
    volumes:
      - floci-gcp-data:/app/data
    ports:
      - "127.0.0.1:4588:4588"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M

  floci-oracle:
    image: floci/floci-oci:latest
    container_name: floci-1-oracle
    volumes:
      - floci-oracle-data:/app/data
    ports:
      - "127.0.0.1:4599:4599"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M

  openwa:
    profiles: ["whatsapp"]
    image: rmyndharis/openwa:latest
    container_name: openwa
    restart: unless-stopped
    ports:
      - "127.0.0.1:2785:2785"
    volumes:
      - openwa-data:/app/data
    environment:
      NODE_ENV: development
      DATABASE_TYPE: sqlite
      STORAGE_TYPE: s3
      S3_ENDPOINT: http://floci:4566
      S3_BUCKET: openwa-media
      S3_ACCESS_KEY_ID: local-floci-access-key
      S3_SECRET_ACCESS_KEY: local-floci-secret-key-not-for-production
      S3_REGION: us-east-1
      ENGINE_TYPE: baileys
    depends_on:
      - floci
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:2785/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  db-data:
  app-storage:
  floci-data:
  floci-azure-data:
  floci-gcp-data:
  floci-oracle-data:
  openwa-data:
