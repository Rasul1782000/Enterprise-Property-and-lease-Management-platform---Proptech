services:
  jenkins:
    image: property-lease-jenkins:local
    build:
      context: .
      dockerfile: Dockerfile.jenkins
    container_name: jenkins-server
    ports:
      - "127.0.0.1:8888:8080"
    volumes:
      - jenkins_home:/var/jenkins_home
      - //var/run/docker.sock:/var/run/docker.sock
    environment:
      JENKINS_ADMIN_PASSWORD: "${JENKINS_ADMIN_PASSWORD:?Set JENKINS_ADMIN_PASSWORD before starting Jenkins}"
      JAVA_OPTS: "-Djenkins.install.runSetupWizard=false"
      CASC_JENKINS_CONFIG: "/etc/jenkins/casc.yaml"
      JENKINS_OPTS: "--httpPort=8080"
    restart: unless-stopped

  floci:
    image: floci/floci:latest
    container_name: floci
    volumes:
      - floci_data:/app/data
    ports:
      - "127.0.0.1:4566:4566"
      - "127.0.0.1:4500:4500"
    restart: unless-stopped

  openwa:
    profiles: ["whatsapp"]
    image: rmyndharis/openwa:latest
    container_name: openwa
    restart: unless-stopped
    ports:
      - "127.0.0.1:2785:2785"
    volumes:
      - openwa_data:/app/data
    environment:
      NODE_ENV: development
      DATABASE_TYPE: sqlite
      STORAGE_TYPE: s3
      S3_ENDPOINT: http://floci:4566
      S3_BUCKET: openwa-media
      S3_ACCESS_KEY_ID: local-floci-access-key
      S3_SECRET_ACCESS_KEY: local-floci-secret-key-not-for-production
      S3_REGION: us-east-1
      ENGINE_TYPE: baileys
    networks:
      - default
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:2785/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  jenkins_home:
  floci_data:
  openwa_data:
