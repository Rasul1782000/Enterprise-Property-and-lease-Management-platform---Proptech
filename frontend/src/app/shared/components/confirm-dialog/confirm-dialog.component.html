<p-dialog
  [header]="title"
  [modal]="true"
  [visible]="true"
  [closable]="true"
  [draggable]="false"
  [style]="{ width: '26rem' }"
  (onHide)="onHide()"
>
  <div class="confirm-body">
    <i class="pi pi-exclamation-triangle" [class]="'pi pi-exclamation-triangle confirm-icon-' + severity"></i>
    <p>{{ message }}</p>
  </div>

  <ng-template #footer>
    <p-button [label]="cancelLabel" severity="secondary" [text]="true" (onClick)="cancelled.emit()" />
    <p-button [label]="confirmLabel" [severity]="severity" icon="pi pi-check" (onClick)="confirmed.emit()" />
  </ng-template>
</p-dialog>
