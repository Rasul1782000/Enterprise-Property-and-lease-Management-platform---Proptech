<div class="filter-shell">
  <form [formGroup]="form" class="filter-form">
    <p-iconfield class="filter-search">
      <p-inputicon styleClass="pi pi-search" />
      <input pInputText formControlName="search" [placeholder]="searchPlaceholder" />
    </p-iconfield>

    <p-select
      formControlName="status"
      [options]="[{ label: 'All Status', value: '' }, ...statusOptions]"
      optionLabel="label"
      optionValue="value"
      placeholder="All Status"
      class="filter-status"
    />

    <p-button
      type="button"
      label="Clear"
      icon="pi pi-filter-slash"
      severity="secondary"
      [outlined]="true"
      [disabled]="!hasFilters()"
      (onClick)="clearFilters()"
    />
  </form>
</div>
