<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
  @for (c of cards; track c.label) {
    <div class="stat-card">
      <div class="flex items-start justify-between gap-3">
        <div class="min-w-0">
          <p class="metric-label">{{ c.label }}</p>
          <p class="metric-value">{{ c.value }}</p>
          @if (c.hint) {
            <p class="text-xs text-zinc-400 mt-1 truncate">{{ c.hint }}</p>
          }
        </div>
        <span class="shrink-0 grid place-items-center w-9 h-9 rounded-lg" [class]="tone(c.tone).chip">
          <i [class]="tone(c.tone).icon + ' text-base ' + c.icon"></i>
        </span>
      </div>
    </div>
  }
</div>
