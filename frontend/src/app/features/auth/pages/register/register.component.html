<div class="auth-container">
  <div class="auth-card">
    <h2>Create Account</h2>
    <p class="auth-subtitle">Sign up for a new account</p>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="auth-form">
      <div class="form-field">
        <label for="name">Full Name</label>
        <input id="name" type="text" formControlName="name" placeholder="Enter your name" />
      </div>

      <div class="form-field">
        <label for="email">Email</label>
        <input id="email" type="email" formControlName="email" placeholder="Enter your email" />
      </div>

      <div class="form-field">
        <label for="password">Password</label>
        <input id="password" [type]="hidePassword() ? 'password' : 'text'" formControlName="password" placeholder="Enter password" />
      </div>

      <div class="form-field">
        <label for="password_confirmation">Confirm Password</label>
        <input id="password_confirmation" [type]="hidePassword() ? 'password' : 'text'" formControlName="password_confirmation" placeholder="Confirm password" />
      </div>

      @if (error()) { <div class="error-message">{{ error() }}</div> }

      <button type="submit" class="btn-primary" [disabled]="loading()">
        {{ loading() ? 'Creating account...' : 'Create Account' }}
      </button>
    </form>

    <p class="auth-link">Already have an account? <a routerLink="/login">Sign in</a></p>
  </div>
</div>
