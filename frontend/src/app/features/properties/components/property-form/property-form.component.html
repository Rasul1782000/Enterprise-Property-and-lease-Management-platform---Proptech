  <h2 mat-dialog-title>{{ data.mode === 'create' ? 'Add Property' : 'Edit Property' }}</h2>
  <mat-dialog-content class="min-w-[500px]">
    <form [formGroup]="form" class="space-y-4">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <mat-form-field appearance="outline" class="w-full">
          <mat-label>Code *</mat-label>
          <input matInput formControlName="code" required maxlength="20">
          <mat-error *ngIf="form.get('code')?.hasError('required')">Code is required</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="w-full">
          <mat-label>Name *</mat-label>
          <input matInput formControlName="name" required maxlength="100">
          <mat-error *ngIf="form.get('name')?.hasError('required')">Name is required</mat-error>
        </mat-form-field>
      </div>

      <mat-form-field appearance="outline" class="w-full">
        <mat-label>Type *</mat-label>
        <mat-select formControlName="type" required>
          <mat-option value="commercial">Commercial</mat-option>
          <mat-option value="residential">Residential</mat-option>
          <mat-option value="mixed">Mixed Use</mat-option>
          <mat-option value="industrial">Industrial</mat-option>
          <mat-option value="retail">Retail</mat-option>
          <mat-option value="office">Office</mat-option>
        </mat-select>
        <mat-error *ngIf="form.get('type')?.hasError('required')">Type is required</mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline" class="w-full">
        <mat-label>Address *</mat-label>
        <input matInput formControlName="address" required maxlength="255">
        <mat-error *ngIf="form.get('address')?.hasError('required')">Address is required</mat-error>
      </mat-form-field>

      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <mat-form-field appearance="outline" class="w-full">
          <mat-label>City *</mat-label>
          <input matInput formControlName="city" required maxlength="100">
        </mat-form-field>

        <mat-form-field appearance="outline" class="w-full">
          <mat-label>State *</mat-label>
          <input matInput formControlName="state" required maxlength="50">
        </mat-form-field>

        <mat-form-field appearance="outline" class="w-full">
          <mat-label>ZIP *</mat-label>
          <input matInput formControlName="zip" required maxlength="20">
        </mat-form-field>
      </div>

      <mat-form-field appearance="outline" class="w-full">
        <mat-label>Country</mat-label>
        <input matInput formControlName="country" value="USA">
      </mat-form-field>
    </form>
  </mat-dialog-content>
  <mat-dialog-actions align="end" class="gap-2">
    <button mat-button (click)="onCancel()">Cancel</button>
    <button mat-flat-button color="primary" (click)="onSubmit()" [disabled]="form.invalid || loading()">
      @if (loading()) {
        <mat-spinner diameter="20"></mat-spinner>
      } @else {
        {{ data.mode === 'create' ? 'Create' : 'Update' }}
      }
    </button>
  </mat-dialog-actions>
