<p-dialog
  [header]="title"
  [modal]="true"
  [visible]="visible"
  [draggable]="false"
  [style]="{ width: '40rem' }"
  (visibleChange)="visibleChange.emit($event)"
>
  <form [formGroup]="form" class="form-grid">
    <div class="field">
      <label class="field-label" for="pf-code">Code *</label>
      <input pInputText id="pf-code" formControlName="code" maxlength="20" />
      @if (form.get('code')?.hasError('required')) {
        <small class="field-error">Code is required</small>
      }
    </div>

    <div class="field">
      <label class="field-label" for="pf-name">Name *</label>
      <input pInputText id="pf-name" formControlName="name" maxlength="100" />
      @if (form.get('name')?.hasError('required')) {
        <small class="field-error">Name is required</small>
      }
    </div>

    <div class="field field-full">
      <label class="field-label" for="pf-type">Type *</label>
      <p-select
        formControlName="type"
        inputId="pf-type"
        [options]="typeOptions"
        optionLabel="label"
        optionValue="value"
        placeholder="Select type"
        appendTo="body"
      />
      @if (form.get('type')?.hasError('required')) {
        <small class="field-error">Type is required</small>
      }
    </div>

    <div class="field field-full">
      <label class="field-label" for="pf-address">Address *</label>
      <input pInputText id="pf-address" formControlName="address" maxlength="255" />
      @if (form.get('address')?.hasError('required')) {
        <small class="field-error">Address is required</small>
      }
    </div>

    <div class="field">
      <label class="field-label" for="pf-city">City *</label>
      <input pInputText id="pf-city" formControlName="city" maxlength="100" />
    </div>

    <div class="field">
      <label class="field-label" for="pf-state">State *</label>
      <input pInputText id="pf-state" formControlName="state" maxlength="50" />
    </div>

    <div class="field">
      <label class="field-label" for="pf-zip">ZIP *</label>
      <input pInputText id="pf-zip" formControlName="zip" maxlength="20" />
    </div>

    <div class="field">
      <label class="field-label" for="pf-country">Country</label>
      <input pInputText id="pf-country" formControlName="country" />
    </div>
  </form>

  <ng-template #footer>
    <p-button label="Cancel" [text]="true" (onClick)="onCancel()" />
    <p-button
      [label]="submitLabel"
      icon="pi pi-check"
      [loading]="loading()"
      [disabled]="form.invalid || loading()"
      (onClick)="onSubmit()"
    />
  </ng-template>
</p-dialog>
