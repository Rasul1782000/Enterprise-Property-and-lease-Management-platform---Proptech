<p-dialog
  [header]="data.mode === 'create' ? 'Add Lease' : 'Edit Lease'"
  [visible]="true"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  [style]="{ width: '42rem' }"
  (onHide)="onCancel()"
>
  <form [formGroup]="form" class="lease-form">
    <div class="field">
      <label class="field-label" for="lease-code">Code *</label>
      <input pInputText id="lease-code" class="w-full" formControlName="code" maxlength="50" [invalid]="isInvalid('code')" />
      @if (form.get('code')?.hasError('required')) {
        <small class="field-error">Code is required</small>
      }
    </div>

    <div class="field">
      <label class="field-label" for="lease-type">Type *</label>
      <p-select
        inputId="lease-type"
        class="w-full"
        formControlName="type"
        [options]="typeOptions"
        optionLabel="label"
        optionValue="value"
        placeholder="Select type"
        appendTo="body"
      />
    </div>

    <div class="field">
      <label class="field-label" for="lease-start">Start Date *</label>
      <p-datepicker
        inputId="lease-start"
        class="w-full"
        formControlName="start_date"
        [showIcon]="true"
        appendTo="body"
        dateFormat="M d, yy"
      />
    </div>

    <div class="field">
      <label class="field-label" for="lease-end">End Date *</label>
      <p-datepicker
        inputId="lease-end"
        class="w-full"
        formControlName="end_date"
        [showIcon]="true"
        appendTo="body"
        dateFormat="M d, yy"
      />
    </div>

    <div class="field">
      <label class="field-label" for="lease-rent">Rent Amount *</label>
      <p-inputnumber
        inputId="lease-rent"
        class="w-full"
        formControlName="rent_amount"
        mode="currency"
        currency="USD"
        locale="en-US"
        [minFractionDigits]="2"
        [maxFractionDigits]="2"
      />
    </div>

    <div class="field">
      <label class="field-label" for="lease-deposit">Deposit Amount *</label>
      <p-inputnumber
        inputId="lease-deposit"
        class="w-full"
        formControlName="deposit_amount"
        mode="currency"
        currency="USD"
        locale="en-US"
        [minFractionDigits]="2"
        [maxFractionDigits]="2"
      />
    </div>

    <div class="field">
      <label class="field-label" for="lease-frequency">Payment Frequency *</label>
      <p-select
        inputId="lease-frequency"
        class="w-full"
        formControlName="payment_frequency"
        [options]="frequencyOptions"
        optionLabel="label"
        optionValue="value"
        placeholder="Select frequency"
        appendTo="body"
      />
    </div>

    <div class="field">
      <label class="field-label" for="lease-escalation">Escalation Clause</label>
      <input pInputText id="lease-escalation" class="w-full" formControlName="escalation_clause" placeholder="e.g., 3% annual increase" />
    </div>

    <div class="field">
      <label class="field-label" for="lease-renewal">Renewal Options (months)</label>
      <p-inputnumber inputId="lease-renewal" class="w-full" formControlName="renewal_options" [maxFractionDigits]="0" />
    </div>

    <div class="field field-full">
      <label class="field-label" for="lease-terms">Terms &amp; Conditions</label>
      <textarea pTextarea id="lease-terms" class="w-full" formControlName="terms" rows="4" [invalid]="isInvalid('terms')"></textarea>
    </div>
  </form>

  <ng-template #footer>
    <p-button label="Cancel" severity="secondary" [text]="true" (onClick)="onCancel()" />
    <p-button
      [label]="data.mode === 'create' ? 'Create' : 'Update'"
      icon="pi pi-check"
      [loading]="loading()"
      [disabled]="form.invalid"
      (onClick)="onSubmit()"
    />
  </ng-template>
</p-dialog>
