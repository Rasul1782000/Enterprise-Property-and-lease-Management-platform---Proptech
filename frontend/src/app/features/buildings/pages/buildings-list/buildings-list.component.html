  <div class="space-y-4">
    <div class="page-header">
      <div>
        <h1 class="page-title">Buildings ({{ total() }})</h1>
        <p class="page-subtitle">{{ buildings().length }} of {{ total() }} shown</p>
      </div>
      <p-button label="Add Building" icon="pi pi-plus" (onClick)="openCreateDialog()" />
    </div>

    <p-menu #rowMenu [popup]="true" [model]="menuItems()" appendTo="body" />

    <p-card styleClass="section-card">
      <p-table
        [value]="buildings()"
        [lazy]="true"
        [paginator]="true"
        [rows]="perPage"
        [first]="first"
        [totalRecords]="total()"
        [rowsPerPageOptions]="[10, 15, 25, 50]"
        [loading]="loading()"
        [rowHover]="true"
        [sortField]="sort"
        [sortOrder]="dir === 'asc' ? 1 : -1"
        [tableStyle]="{ 'min-width': '60rem' }"
        (onSort)="onSort($event)"
        (onPage)="onPage($event)">
        <ng-template #header>
          <tr>
            <th pSortableColumn="code">Code</th>
            <th pSortableColumn="name">Name</th>
            <th>Property</th>
            <th class="text-right">Floors</th>
            <th class="text-right">Units</th>
            <th>Status</th>
            <th class="col-actions"></th>
          </tr>
        </ng-template>
        <ng-template #body let-row>
          <tr>
            <td><span class="code-chip">{{ row.code }}</span></td>
            <td>
              <a class="row-link" [routerLink]="['/buildings', row.id]">{{ row.name }}</a>
              <div class="row-sub">{{ row.address }}, {{ row.city }}</div>
            </td>
            <td>{{ row.property?.name || 'N/A' }}</td>
            <td class="text-right">{{ row.floors }}</td>
            <td class="text-right">{{ row.units_count }}</td>
            <td><p-tag [value]="row.status" [severity]="statusSeverity(row.status)" /></td>
            <td>
              <p-button
                icon="pi pi-ellipsis-v"
                [text]="true"
                [rounded]="true"
                ariaLabel="Actions"
                (onClick)="openRowMenu(row, $event)"
              />
            </td>
          </tr>
        </ng-template>
        <ng-template #emptymessage>
          <div class="empty-state">
            <i class="pi pi-inbox"></i>
            <p>No records found</p>
          </div>
        </ng-template>
      </p-table>
    </p-card>

    <app-building-form
      [visible]="formVisible()"
      [data]="formData()"
      (visibleChange)="formVisible.set($event)"
      (closed)="onFormClosed($event)"
    />
  </div>
