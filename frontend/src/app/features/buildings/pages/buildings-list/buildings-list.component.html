  <div class="space-y-4">
    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
      <div>
        <h1 class="page-title">Buildings ({{total()}})</h1>
        <p class="text-slate-500 text-sm">{{ buildings().length }} of {{ total() }} shown</p>
      </div>
      <button mat-flat-button color="primary" (click)="openCreateDialog()">
        <mat-icon>add</mat-icon> Add Building
      </button>
    </div>

    <mat-card>
      <mat-card-content class="p-0">
        @if (loading()) {
          <div class="flex justify-center py-12">
            <mat-spinner diameter="40"></mat-spinner>
          </div>
        } @else {
          <div class="overflow-x-auto">
            <table mat-table [dataSource]="buildings()" matSort (matSortChange)="onSort($event)" class="w-full">
              <ng-container matColumnDef="code"><th mat-header-cell *matHeaderCellDef mat-sort-header>Code</th><td mat-cell *matCellDef="let b"><span class="font-mono text-xs bg-slate-100 px-2 py-1 rounded">{{b.code}}</span></td></ng-container>
              <ng-container matColumnDef="name"><th mat-header-cell *matHeaderCellDef mat-sort-header>Name</th><td mat-cell *matCellDef="let b"><a class="text-primary font-medium hover:underline" [routerLink]="['/buildings', b.id]">{{b.name}}</a><div class="text-xs text-slate-500">{{b.address}}, {{b.city}}</div></td></ng-container>
              <ng-container matColumnDef="property"><th mat-header-cell *matHeaderCellDef>Property</th><td mat-cell *matCellDef="let b">{{b.property?.name || 'N/A'}}</td></ng-container>
              <ng-container matColumnDef="floors"><th mat-header-cell *matHeaderCellDef>Floors</th><td mat-cell *matCellDef="let b">{{b.floors}}</td></ng-container>
              <ng-container matColumnDef="units_count"><th mat-header-cell *matHeaderCellDef>Units</th><td mat-cell *matCellDef="let b">{{b.units_count}}</td></ng-container>
              <ng-container matColumnDef="status"><th mat-header-cell *matHeaderCellDef>Status</th><td mat-cell *matCellDef="let b"><span class="text-xs px-2 py-1 rounded" [ngClass]="b.status==='active'?'bg-emerald-100 text-emerald-700':b.status==='under_maintenance'?'bg-amber-100 text-amber-700':'bg-slate-100'">{{b.status}}</span></td></ng-container>
              <ng-container matColumnDef="actions"><th mat-header-cell *matHeaderCellDef></th><td mat-cell *matCellDef="let b"><button mat-icon-button [matMenuTriggerFor]="menu"><mat-icon>more_vert</mat-icon></button><mat-menu #menu="matMenu"><button mat-menu-item [routerLink]="['/buildings', b.id]"><mat-icon>visibility</mat-icon> View</button><button mat-menu-item (click)="editBuilding(b)"><mat-icon>edit</mat-icon> Edit</button><hr class="my-1"><button mat-menu-item (click)="deleteBuilding(b)" class="text-red-600"><mat-icon>delete</mat-icon> Delete</button></mat-menu></td></ng-container>
              <tr mat-header-row *matHeaderRowDef="cols"></tr>
              <tr mat-row *matRowDef="let row; columns: cols;" class="hover:bg-slate-50"></tr>
            </table>
          </div>
          <mat-paginator [length]="total()" [pageSize]="perPage" [pageSizeOptions]="[10,15,25,50]" (page)="onPage($event)" showFirstLastButtons></mat-paginator>
        }
      </mat-card-content>
    </mat-card>
  </div>
