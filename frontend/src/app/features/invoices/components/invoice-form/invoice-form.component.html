<h2 class="form-title">{{ data.mode === 'create' ? 'Create Invoice' : 'Edit Invoice' }}</h2>

<form [formGroup]="form" class="space-y-4">
  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
    <div class="field">
      <label class="field-label" for="leaseId">Lease <span class="req">*</span></label>
      <p-select
        inputId="leaseId"
        formControlName="lease_id"
        [options]="leaseOptions()"
        optionLabel="label"
        optionValue="value"
        placeholder="Select a lease"
        appendTo="body"
        class="w-full"
        [invalid]="!!form.get('lease_id')?.invalid && form.get('lease_id')?.touched"
        (onChange)="onLeaseChange($event.value)" />
      @if (form.get('lease_id')?.hasError('required') && form.get('lease_id')?.touched) {
        <small class="field-error">Lease is required</small>
      }
    </div>

    <div class="field">
      <label class="field-label" for="invoiceType">Type <span class="req">*</span></label>
      <p-select
        inputId="invoiceType"
        formControlName="type"
        [options]="typeOptions"
        optionLabel="label"
        optionValue="value"
        placeholder="Select a type"
        appendTo="body"
        class="w-full" />
    </div>

    <div class="field">
      <label class="field-label" for="issueDate">Issue Date <span class="req">*</span></label>
      <p-datepicker
        inputId="issueDate"
        formControlName="issue_date"
        [showIcon]="true"
        appendTo="body"
        dateFormat="M d, yy"
        class="w-full"
        [invalid]="!!form.get('issue_date')?.invalid && form.get('issue_date')?.touched" />
    </div>

    <div class="field">
      <label class="field-label" for="dueDate">Due Date <span class="req">*</span></label>
      <p-datepicker
        inputId="dueDate"
        formControlName="due_date"
        [showIcon]="true"
        appendTo="body"
        dateFormat="M d, yy"
        class="w-full"
        [invalid]="!!form.get('due_date')?.invalid && form.get('due_date')?.touched" />
    </div>

    <div class="field">
      <label class="field-label" for="amount">Amount</label>
      <p-inputnumber inputId="amount" formControlName="amount" [min]="0" class="w-full" />
    </div>

    <div class="field">
      <label class="field-label" for="currency">Currency</label>
      <input pInputText id="currency" formControlName="currency" class="w-full" />
    </div>
  </div>

  <div class="field">
    <label class="field-label" for="description">Description</label>
    <textarea pTextarea id="description" formControlName="description" rows="3" class="w-full"></textarea>
  </div>

  <p-divider />

  <div>
    <div class="flex items-center justify-between mb-3">
      <h4 class="font-medium">Line Items</h4>
      <p-button label="Add Line Item" icon="pi pi-plus" [outlined]="true" type="button" (onClick)="addLineItem()" />
    </div>

    <div formArrayName="line_items" class="line-items">
      @for (item of lineItems.controls; track item) {
        <div class="line-item-row" [formGroup]="$any(item)">
          <div class="field col-2">
            <label class="field-label" [for]="'li-desc-' + $index">Description</label>
            <input pInputText [id]="'li-desc-' + $index" formControlName="description" class="w-full" />
          </div>
          <div class="field">
            <label class="field-label" [for]="'li-qty-' + $index">Qty</label>
            <p-inputnumber [inputId]="'li-qty-' + $index" formControlName="quantity" [min]="1" [minFractionDigits]="0" class="w-full" />
          </div>
          <div class="field">
            <label class="field-label" [for]="'li-price-' + $index">Unit Price</label>
            <p-inputnumber [inputId]="'li-price-' + $index" formControlName="unit_price" [min]="0" [minFractionDigits]="2" class="w-full" />
          </div>
          <div class="field">
            <label class="field-label" [for]="'li-tax-' + $index">Tax %</label>
            <p-inputnumber [inputId]="'li-tax-' + $index" formControlName="tax_rate" [min]="0" [max]="100" [minFractionDigits]="2" class="w-full" />
          </div>
          <div class="line-total">{{ money(lineTotal($any(item))) }}</div>
          <p-button icon="pi pi-trash" [text]="true" [rounded]="true" severity="danger" type="button" pTooltip="Remove line item" (onClick)="removeLineItem($index)" />
        </div>
      } @empty {
        <div class="empty-state">
          <i class="pi pi-inbox"></i>
          <p>No line items yet</p>
        </div>
      }
    </div>
  </div>

  <div class="form-footer">
    <p-button label="Cancel" [text]="true" type="button" (onClick)="onCancel()" />
    <p-button
      [label]="data.mode === 'create' ? 'Create' : 'Update'"
      icon="pi pi-check"
      type="button"
      [loading]="loading()"
      [disabled]="form.invalid || loading()"
      (onClick)="onSubmit()" />
  </div>
</form>
