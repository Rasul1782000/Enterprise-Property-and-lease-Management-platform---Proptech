  <div class="space-y-4">
    <div class="page-header">
      <div>
        <h1 class="page-title">Tenants ({{ total() }})</h1>
        <p class="page-subtitle">{{ tenants().length }} of {{ total() }} shown</p>
      </div>
      <p-button label="Add Tenant" icon="pi pi-user-plus" (onClick)="openCreateDialog()" />
    </div>

    <p-card>
      <p-table
        [value]="tenants()"
        [paginator]="true"
        [rows]="10"
        [rowsPerPageOptions]="[5, 10, 20, 50]"
        [loading]="loading()"
        [rowHover]="true"
        [tableStyle]="{ 'min-width': '64rem' }"
        (onSort)="onSort($event)"
        (onPage)="onPage($event)">
        <ng-template #header>
          <tr>
            <th pSortableColumn="code">Code <p-sortIcon field="code" /></th>
            <th pSortableColumn="name">Name <p-sortIcon field="name" /></th>
            <th>Company</th>
            <th>Phone</th>
            <th>Status</th>
            <th>Leases</th>
            <th class="col-actions"></th>
          </tr>
        </ng-template>
        <ng-template #body let-row>
          <tr>
            <td><span class="code-chip">{{ row.code }}</span></td>
            <td>
              <a class="row-link" [routerLink]="['/tenants', row.id]">{{ row.first_name }} {{ row.last_name }}</a>
              <div class="row-sub">{{ row.email }}</div>
            </td>
            <td>{{ row.company || '—' }}</td>
            <td>{{ row.phone }}</td>
            <td><p-tag [value]="row.status" [severity]="statusSeverity(row.status)" /></td>
            <td>{{ row.leases_count }}</td>
            <td>
              <p-button icon="pi pi-ellipsis-v" [text]="true" [rounded]="true" (click)="ref.toggle($event)" />
              <p-menu #ref [popup]="true" [model]="rowMenu(row)" appendTo="body" />
            </td>
          </tr>
        </ng-template>
        <ng-template #emptymessage>
          <div class="empty-state"><i class="pi pi-inbox"></i><p>No records found</p></div>
        </ng-template>
      </p-table>
    </p-card>

    <p-dialog
      [header]="formData().mode === 'edit' ? 'Edit Tenant' : 'Add Tenant'"
      [modal]="true"
      [visible]="formVisible()"
      (visibleChange)="formVisible.set($event)"
      [style]="{ width: '40rem' }">
      <app-tenant-form #formRef [data]="formData()" (closed)="onFormClosed($event)" />
      <ng-template #footer>
        <p-button label="Cancel" [text]="true" (onClick)="formRef.onCancel()" />
        <p-button
          [label]="formData().mode === 'create' ? 'Create' : 'Update'"
          icon="pi pi-check"
          [loading]="formRef.loading()"
          [disabled]="formRef.form.invalid"
          (onClick)="formRef.onSubmit()" />
      </ng-template>
    </p-dialog>
  </div>
