  <div class="space-y-4">
    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
      <div><h1 class="page-title">Tenants ({{total()}})</h1><p class="text-slate-500 text-sm">{{ tenants().length }} of {{ total() }} shown</p></div>
      <button mat-flat-button color="primary" (click)="openCreateDialog()"><mat-icon>person_add</mat-icon> Add Tenant</button>
    </div>

    <mat-card><mat-card-content class="p-0">
      @if (loading()) { <div class="flex justify-center py-12"><mat-spinner diameter="40"></mat-spinner></div> }
      @else {
        <div class="overflow-x-auto">
          <table mat-table [dataSource]="tenants()" matSort (matSortChange)="onSort($event)" class="w-full">
            <ng-container matColumnDef="code"><th mat-header-cell *matHeaderCellDef mat-sort-header>Code</th><td mat-cell *matCellDef="let t"><span class="font-mono text-xs bg-slate-100 px-2 py-1 rounded">{{t.code}}</span></td></ng-container>
            <ng-container matColumnDef="name"><th mat-header-cell *matHeaderCellDef mat-sort-header>Name</th><td mat-cell *matCellDef="let t"><a class="text-primary font-medium hover:underline" [routerLink]="['/tenants', t.id]">{{t.first_name}} {{t.last_name}}</a><div class="text-xs text-slate-500">{{t.email}}</div></td></ng-container>
            <ng-container matColumnDef="company"><th mat-header-cell *matHeaderCellDef>Company</th><td mat-cell *matCellDef="let t">{{t.company || '—'}}</td></ng-container>
            <ng-container matColumnDef="phone"><th mat-header-cell *matHeaderCellDef>Phone</th><td mat-cell *matCellDef="let t">{{t.phone}}</td></ng-container>
            <ng-container matColumnDef="status"><th mat-header-cell *matHeaderCellDef>Status</th><td mat-cell *matCellDef="let t"><span class="text-xs px-2 py-1 rounded" [ngClass]="getStatusClass(t.status)">{{t.status}}</span></td></ng-container>
            <ng-container matColumnDef="leases_count"><th mat-header-cell *matHeaderCellDef>Leases</th><td mat-cell *matCellDef="let t">{{t.leases_count}}</td></ng-container>
            <ng-container matColumnDef="actions"><th mat-header-cell *matHeaderCellDef></th><td mat-cell *matCellDef="let t"><button mat-icon-button [matMenuTriggerFor]="menu"><mat-icon>more_vert</mat-icon></button><mat-menu #menu="matMenu"><button mat-menu-item [routerLink]="['/tenants', t.id]"><mat-icon>visibility</mat-icon> View</button><button mat-menu-item (click)="editTenant(t)"><mat-icon>edit</mat-icon> Edit</button><hr class="my-1"><button mat-menu-item (click)="deleteTenant(t)" class="text-red-600"><mat-icon>delete</mat-icon> Delete</button></mat-menu></td></ng-container>
            <tr mat-header-row *matHeaderRowDef="cols"></tr>
            <tr mat-row *matRowDef="let row; columns: cols;" class="hover:bg-slate-50"></tr>
          </table>
        </div>
        <mat-paginator [length]="total()" [pageSize]="perPage" [pageSizeOptions]="[10,15,25,50]" (page)="onPage($event)" showFirstLastButtons></mat-paginator>
      }
    </mat-card-content></mat-card>
  </div>
