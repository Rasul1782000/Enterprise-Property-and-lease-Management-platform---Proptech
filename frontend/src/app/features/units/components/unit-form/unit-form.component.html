    <form [formGroup]="form" class="form-grid">
      <div class="field">
        <label class="field-label" for="property_id">Property *</label>
        <p-select
          inputId="property_id"
          formControlName="property_id"
          [options]="propertyOptions()"
          optionLabel="label"
          optionValue="value"
          placeholder="Select a property"
          appendTo="body"
          [invalid]="form.get('property_id')?.invalid === true && form.get('property_id')?.touched === true"
          (onChange)="onPropertyChange($event.value)" />
        @if (form.get('property_id')?.hasError('required')) { <small class="field-error">Property is required</small> }
      </div>

      <div class="field">
        <label class="field-label" for="building_id">Building *</label>
        <p-select
          inputId="building_id"
          formControlName="building_id"
          [options]="buildingOptions()"
          optionLabel="label"
          optionValue="value"
          placeholder="Select a building"
          appendTo="body"
          [invalid]="form.get('building_id')?.invalid === true && form.get('building_id')?.touched === true" />
        @if (form.get('building_id')?.hasError('required')) { <small class="field-error">Building is required</small> }
      </div>

      <div class="field-row">
        <div class="field">
          <label class="field-label" for="code">Code *</label>
          <input pInputText id="code" formControlName="code" maxlength="20" />
          @if (form.get('code')?.hasError('required')) { <small class="field-error">Code is required</small> }
        </div>
        <div class="field">
          <label class="field-label" for="name">Name *</label>
          <input pInputText id="name" formControlName="name" maxlength="100" />
          @if (form.get('name')?.hasError('required')) { <small class="field-error">Name is required</small> }
        </div>
      </div>

      <div class="field">
        <label class="field-label" for="type">Type *</label>
        <p-select inputId="type" formControlName="type" [options]="typeOptions" optionLabel="label" optionValue="value" placeholder="Select a type" appendTo="body" />
      </div>

      <div class="field-row field-row-4">
        <div class="field">
          <label class="field-label" for="floor">Floor *</label>
          <p-inputnumber inputId="floor" formControlName="floor" [min]="0" [max]="100" [showButtons]="true" [inputStyle]="{ width: '100%' }" />
        </div>
        <div class="field">
          <label class="field-label" for="area_sqft">Area (sqft) *</label>
          <p-inputnumber inputId="area_sqft" formControlName="area_sqft" [min]="0" [showButtons]="true" [inputStyle]="{ width: '100%' }" />
        </div>
        <div class="field">
          <label class="field-label" for="bedrooms">Bedrooms *</label>
          <p-inputnumber inputId="bedrooms" formControlName="bedrooms" [min]="0" [max]="10" [showButtons]="true" [inputStyle]="{ width: '100%' }" />
        </div>
        <div class="field">
          <label class="field-label" for="bathrooms">Bathrooms *</label>
          <p-inputnumber inputId="bathrooms" formControlName="bathrooms" [min]="0" [max]="10" [showButtons]="true" [inputStyle]="{ width: '100%' }" />
        </div>
      </div>

      <div class="field">
        <label class="field-label" for="base_rent">Base Rent *</label>
        <p-inputnumber inputId="base_rent" formControlName="base_rent" mode="currency" currency="USD" locale="en-US" [min]="0" [minFractionDigits]="2" [maxFractionDigits]="2" [inputStyle]="{ width: '100%' }" />
      </div>

      <div class="field">
        <label class="field-label" for="status">Status</label>
        <p-select inputId="status" formControlName="status" [options]="statusOptions" optionLabel="label" optionValue="value" appendTo="body" />
      </div>
    </form>
