  <div class="space-y-4">
    <div class="page-header">
      <div>
        <h1 class="page-title">Units ({{ total() }})</h1>
        <p class="page-subtitle">{{ units().length }} of {{ total() }} shown</p>
      </div>
      <p-button label="Add Unit" icon="pi pi-plus" (onClick)="openCreateDialog()" />
    </div>

    <p-card>
      <p-table
        [value]="units()"
        [paginator]="true"
        [rows]="10"
        [rowsPerPageOptions]="[5, 10, 20, 50]"
        [loading]="loading()"
        [rowHover]="true"
        [tableStyle]="{ 'min-width': '64rem' }"
        (onSort)="onSort($event)"
        (onPage)="onPage($event)">
        <ng-template #header>
          <tr>
            <th pSortableColumn="code">Code</th>
            <th pSortableColumn="name">Name</th>
            <th>Type</th>
            <th pSortableColumn="floor">Floor</th>
            <th>Area (sqft)</th>
            <th pSortableColumn="base_rent">Base Rent</th>
            <th>Status</th>
            <th class="col-actions"></th>
          </tr>
        </ng-template>
        <ng-template #body let-row>
          <tr>
            <td><span class="code-chip">{{ row.code }}</span></td>
            <td>
              <a class="row-link" [routerLink]="['/units', row.id]">{{ row.name }}</a>
              <div class="row-sub">{{ row.building?.name || 'N/A' }}</div>
            </td>
            <td><span class="text-xs border px-2 py-1 rounded uppercase">{{ row.type }}</span></td>
            <td>{{ row.floor }}</td>
            <td>{{ row.area_sqft }}</td>
            <td>{{ money(row.base_rent) }}</td>
            <td><p-tag [value]="row.status" [severity]="statusSeverity(row.status)" /></td>
            <td>
              <p-button icon="pi pi-ellipsis-v" [text]="true" [rounded]="true" (click)="ref.toggle($event)" />
              <p-menu #ref [popup]="true" [model]="rowMenu(row)" appendTo="body" />
            </td>
          </tr>
        </ng-template>
        <ng-template #emptymessage>
          <div class="empty-state"><i class="pi pi-inbox"></i><p>No records found</p></div>
        </ng-template>
      </p-table>
    </p-card>

    <p-dialog
      [header]="formData().mode === 'edit' ? 'Edit Unit' : 'Add Unit'"
      [modal]="true"
      [visible]="formVisible()"
      (visibleChange)="formVisible.set($event)"
      [style]="{ width: '40rem' }">
      <app-unit-form #formRef [data]="formData()" (closed)="onFormClosed($event)" />
      <ng-template #footer>
        <p-button label="Cancel" [text]="true" (onClick)="formRef.onCancel()" />
        <p-button
          [label]="formData().mode === 'create' ? 'Create' : 'Update'"
          icon="pi pi-check"
          [loading]="formRef.loading()"
          [disabled]="formRef.form.invalid"
          (onClick)="formRef.onSubmit()" />
      </ng-template>
    </p-dialog>
  </div>
