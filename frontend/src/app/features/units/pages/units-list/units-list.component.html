  <div class="space-y-4">
    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
      <div><h1 class="page-title">Units ({{total()}})</h1><p class="text-slate-500 text-sm">{{ units().length }} of {{ total() }} shown</p></div>
      <button mat-flat-button color="primary" (click)="openCreateDialog()"><mat-icon>add</mat-icon> Add Unit</button>
    </div>

    <mat-card><mat-card-content class="p-0">
      @if (loading()) { <div class="flex justify-center py-12"><mat-spinner diameter="40"></mat-spinner></div> }
      @else {
        <div class="overflow-x-auto">
          <table mat-table [dataSource]="units()" matSort (matSortChange)="onSort($event)" class="w-full">
            <ng-container matColumnDef="code"><th mat-header-cell *matHeaderCellDef mat-sort-header>Code</th><td mat-cell *matCellDef="let u"><span class="font-mono text-xs bg-slate-100 px-2 py-1 rounded">{{u.code}}</span></td></ng-container>
            <ng-container matColumnDef="name"><th mat-header-cell *matHeaderCellDef mat-sort-header>Name</th><td mat-cell *matCellDef="let u"><a class="text-primary font-medium hover:underline" [routerLink]="['/units', u.id]">{{u.name}}</a><div class="text-xs text-slate-500">{{u.building?.name || 'N/A'}}</div></td></ng-container>
            <ng-container matColumnDef="type"><th mat-header-cell *matHeaderCellDef>Type</th><td mat-cell *matCellDef="let u"><span class="text-xs border px-2 py-1 rounded">{{u.type}}</span></td></ng-container>
            <ng-container matColumnDef="floor"><th mat-header-cell *matHeaderCellDef>Floor</th><td mat-cell *matCellDef="let u">{{u.floor}}</td></ng-container>
            <ng-container matColumnDef="area_sqft"><th mat-header-cell *matHeaderCellDef>Area (sqft)</th><td mat-cell *matCellDef="let u">{{u.area_sqft}}</td></ng-container>
            <ng-container matColumnDef="base_rent"><th mat-header-cell *matHeaderCellDef mat-sort-header>Base Rent</th><td mat-cell *matCellDef="let u">${{u.base_rent}}</td></ng-container>
            <ng-container matColumnDef="status"><th mat-header-cell *matHeaderCellDef>Status</th><td mat-cell *matCellDef="let u"><span class="text-xs px-2 py-1 rounded" [ngClass]="getStatusClass(u.status)">{{u.status}}</span></td></ng-container>
            <ng-container matColumnDef="actions"><th mat-header-cell *matHeaderCellDef></th><td mat-cell *matCellDef="let u"><button mat-icon-button [matMenuTriggerFor]="menu"><mat-icon>more_vert</mat-icon></button><mat-menu #menu="matMenu"><button mat-menu-item [routerLink]="['/units', u.id]"><mat-icon>visibility</mat-icon> View</button><button mat-menu-item (click)="editUnit(u)"><mat-icon>edit</mat-icon> Edit</button><button mat-menu-item (click)="updateStatus(u)"><mat-icon>swap_horiz</mat-icon> Change Status</button><hr class="my-1"><button mat-menu-item (click)="deleteUnit(u)" class="text-red-600"><mat-icon>delete</mat-icon> Delete</button></mat-menu></td></ng-container>
            <tr mat-header-row *matHeaderRowDef="cols"></tr>
            <tr mat-row *matRowDef="let row; columns: cols;" class="hover:bg-slate-50"></tr>
          </table>
        </div>
        <mat-paginator [length]="total()" [pageSize]="perPage" [pageSizeOptions]="[10,15,25,50]" (page)="onPage($event)" showFirstLastButtons></mat-paginator>
      }
    </mat-card-content></mat-card>
  </div>
