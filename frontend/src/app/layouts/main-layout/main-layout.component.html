<div class="portal-shell" [class.nav-open]="navOpen">
  <aside class="portal-sidenav">
    <div class="brand-lockup">
      <span class="brand-mark"><i class="pi pi-building"></i></span>
      <span>Lottly</span>
    </div>

    <nav class="primary-nav" aria-label="Primary navigation">
      @for (section of navSections; track section.heading) {
        <p class="nav-heading">{{ section.heading }}</p>
        @for (item of section.items; track item.route) {
          <a [routerLink]="item.route" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: !!item.exact }" (click)="closeNav()">
            <i [class]="item.icon"></i>
            <span>{{ item.label }}</span>
            @if (item.badge) {
              <span class="nav-badge">{{ item.badge }}</span>
            }
            @if (item.tag) {
              <span class="nav-new">{{ item.tag }}</span>
            }
          </a>
        }
      }
    </nav>

    <div class="protection-card">
      <div class="protection-icon"><i class="pi pi-shield"></i></div>
      <strong>PROTECTION PLAN</strong>
      <small>Your rent safeguard</small>
      <button type="button" routerLink="/invoices" (click)="closeNav()">Learn More</button>
    </div>

    <button type="button" class="logout-link" (click)="logout()">
      <i class="pi pi-sign-out"></i> Logout
    </button>
  </aside>

  <button type="button" class="scrim" aria-label="Close navigation" (click)="closeNav()"></button>

  <section class="portal-content">
    <header class="portal-header">
      <button type="button" class="nav-toggle" aria-label="Toggle navigation" (click)="toggleNav()">
        <i class="pi pi-bars"></i>
      </button>
      <span class="mobile-brand">Lottly</span>
      <span class="header-spacer"></span>
      <p-menu #menu [popup]="true" [model]="profileMenu" styleClass="profile-menu" appendTo="body" />
      <button type="button" class="profile-button" (click)="menu.toggle($event)">
        <span class="avatar">{{ initial }}</span>
        <span>{{ auth.user()?.name || 'John Smith' }}</span>
        <i class="pi pi-angle-down"></i>
      </button>
    </header>

    <main class="portal-main">
      <router-outlet />
    </main>
  </section>
</div>
