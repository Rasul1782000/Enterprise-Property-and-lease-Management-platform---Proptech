apply plugin: 'com.android.application'

android {
    namespace 'com.enterprise.propertylease'
    compileSdk 36
    
    defaultConfig {
        applicationId 'com.enterprise.propertylease'
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName '1.0.0'
        
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        
        // Capacitor configuration
        manifestPlaceholders = [capacitorApplicationId: 'com.enterprise.propertylease']
    }
    
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        
        debug {
            debuggable true
            minifyEnabled false
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    
    
    // Capacitor integration
    // sourceSets {
    //     main {
    //         manifest.srcFile 'src/capacitor/AndroidManifest.xml'
    //         java.srcDirs = ['src/capacitor/src/main/java']
    //         res.srcDirs = ['src/capacitor/src/main/res']
    //         assets.srcDirs = ['src/capacitor/src/main/assets']
    //     }
    // }
    
    dependencies {
        implementation project(':capacitor-android')
        implementation project(':capacitor-cordova-android-plugins')
        implementation "androidx.appcompat:appcompat:1.7.0"
        implementation "androidx.core:core-splashscreen:1.0.0"
    }
}