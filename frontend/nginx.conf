server {
    listen 80;
    server_name _;

    # Docker embedded DNS (used for the /api upstream below)
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/nginx-security-headers.conf;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Hashed build assets are immutable
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|gif|svg|ico|webp)$ {
        expires 1y;
        include /etc/nginx/nginx-security-headers.conf;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    # Laravel API.
    # proxy_pass uses a variable so nginx resolves the backend lazily at request
    # time (Docker's embedded DNS at 127.0.0.11). Without this, nginx refuses to
    # start with "host not found in upstream" whenever the backend is not yet up.
    location /api/ {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        include /etc/nginx/nginx-security-headers.conf;
    }

    # Angular SPA fallback
    location / {
        include /etc/nginx/nginx-security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}