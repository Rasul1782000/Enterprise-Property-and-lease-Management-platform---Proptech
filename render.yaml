# Render Blueprint for the Laravel API.
# Render has no native PHP runtime, so this is a Docker web service.
# Deploy with: Render Dashboard -> New -> Blueprint -> select this repo/main.
#
# MariaDB runs inside the same container and stores its data on a persistent
# disk mounted at /var/lib/mysql. This requires a paid compute plan; Render
# does not allow disks on free web services.

services:
  - type: web
    name: gaarbejana-api
    runtime: docker
    region: virginia
    plan: 0.5c-512mb
    numInstances: 1
    branch: main
    dockerfilePath: ./frontend/deployment/Dockerfile.backend.render
    dockerContext: .
    healthCheckPath: /up
    disk:
      name: mysql-data
      mountPath: /var/lib/mysql
      sizeGB: 1
    envVars:
      - key: APP_NAME
        value: Gaarbejana
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      # Generated once by Render; the entrypoint adds Laravel's base64: prefix.
      - key: APP_KEY
        generateValue: true
      # Self-reference so Laravel always uses the service's Render URL.
      - key: APP_URL
        fromService:
          name: gaarbejana-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: FRONTEND_URL
        sync: false
      - key: LOG_CHANNEL
        value: stderr
      # Bundled MariaDB (localhost inside this container).
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        value: 127.0.0.1
      - key: DB_PORT
        value: "3306"
      - key: DB_DATABASE
        value: Gaarbejana
      - key: DB_USERNAME
        value: property_lease
      - key: DB_PASSWORD
        generateValue: true
      - key: DB_DATA_DIR
        value: /var/lib/mysql
      # Apply migrations on start and seed a small dataset only when empty.
      - key: PORTAL_BOOTSTRAP
        value: "true"
      - key: PORTAL_SEED_USERS
        value: "30"
      - key: CACHE_STORE
        value: file
      - key: SESSION_DRIVER
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      - key: FILESYSTEM_DISK
        value: documents
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_DEFAULT_REGION
        value: us-east-1
      - key: AWS_STORAGE_BUCKET
        sync: false
      - key: AWS_STORAGE_PREFIX
        value: portal
      # false for AWS S3; set to true for R2/other S3-compatible endpoints.
      - key: AWS_USE_PATH_STYLE_ENDPOINT
        value: "false"
