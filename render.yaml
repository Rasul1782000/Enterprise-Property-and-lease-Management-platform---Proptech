# Render Blueprint: Laravel API (Docker) + MySQL 8 private service.
# The database is Oracle's official MySQL Server image, reachable only from
# other services on Render's private network, with data on a persistent disk.
# https://render.com/docs/deploy-mysql

services:
  - type: web
    name: gaarbejana-api
    runtime: docker
    region: virginia
    plan: 0.5c-512mb
    numInstances: 1
    branch: main
    dockerfilePath: ./frontend/deployment/Dockerfile.backend.render
    dockerContext: .
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: Gaarbejana
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      # Generated once by Render; the entrypoint adds Laravel's base64: prefix.
      - key: APP_KEY
        generateValue: true
      # Self-reference so Laravel always uses the service's Render URL.
      - key: APP_URL
        fromService:
          name: gaarbejana-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: FRONTEND_URL
        sync: false
      - key: LOG_CHANNEL
        value: stderr
      # MySQL 8 runs in the private service defined below.
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        fromService:
          name: gaarbejana-mysql
          type: pserv
          property: host
      - key: DB_PORT
        value: "3306"
      - key: DB_DATABASE
        value: Gaarbejana
      - key: DB_USERNAME
        value: property_lease
      # Share the exact password the MySQL service generates.
      - key: DB_PASSWORD
        fromService:
          name: gaarbejana-mysql
          type: pserv
          envVarKey: MYSQL_PASSWORD
      # Apply migrations on start and seed a small dataset only when empty.
      - key: PORTAL_BOOTSTRAP
        value: "true"
      - key: PORTAL_SEED_USERS
        value: "30"
      - key: CACHE_STORE
        value: file
      - key: SESSION_DRIVER
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      - key: FILESYSTEM_DISK
        value: documents
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_DEFAULT_REGION
        value: us-east-1
      - key: AWS_STORAGE_BUCKET
        sync: false
      - key: AWS_STORAGE_PREFIX
        value: portal
      # false for AWS S3; set to true for R2/other S3-compatible endpoints.
      - key: AWS_USE_PATH_STYLE_ENDPOINT
        value: "false"

  - type: pserv
    name: gaarbejana-mysql
    runtime: docker
    region: virginia
    plan: 0.5c-512mb
    dockerfilePath: ./frontend/deployment/Dockerfile.mysql.render
    dockerContext: .
    # Restarting MySQL on every API commit is unnecessary and risks downtime.
    autoDeployTrigger: off
    disk:
      name: gaarbejana-mysql-data
      mountPath: /var/lib/mysql
      sizeGB: 10
    envVars:
      - key: MYSQL_DATABASE
        value: Gaarbejana
      - key: MYSQL_USER
        value: property_lease
      - key: MYSQL_PASSWORD
        generateValue: true
      - key: MYSQL_ROOT_PASSWORD
        generateValue: true
