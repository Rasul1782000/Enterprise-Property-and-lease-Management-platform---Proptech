# Render Blueprint for the Laravel API only.
# Render has no native PHP runtime, so this is a Docker web service.
# Deploy with: Render Dashboard -> New -> Blueprint -> select this repo/main.
#
# MySQL is NOT provided by Render. Point DB_* at an external MySQL instance
# that accepts connections from Render, then run migrations once from the
# service's Shell tab: php artisan migrate --force

services:
  - type: web
    name: gaarbejana-api
    runtime: docker
    region: virginia
    plan: free
    branch: main
    dockerfilePath: ./frontend/deployment/Dockerfile.backend.render
    dockerContext: .
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: Gaarbejana
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      # Paste the output of: php artisan key:generate --show
      - key: APP_KEY
        sync: false
      # Self-reference so Laravel always uses the service's Render URL.
      - key: APP_URL
        fromService:
          name: gaarbejana-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: FRONTEND_URL
        sync: false
      - key: LOG_CHANNEL
        value: stderr
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "3306"
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      # Apply migrations on start and seed a small dataset only when empty.
      - key: PORTAL_BOOTSTRAP
        value: "true"
      - key: PORTAL_SEED_USERS
        value: "30"
      - key: CACHE_STORE
        value: file
      - key: SESSION_DRIVER
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      - key: FILESYSTEM_DISK
        value: documents
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_DEFAULT_REGION
        value: us-east-1
      - key: AWS_STORAGE_BUCKET
        sync: false
      - key: AWS_STORAGE_PREFIX
        value: portal
      # false for AWS S3; set to true for R2/other S3-compatible endpoints.
      - key: AWS_USE_PATH_STYLE_ENDPOINT
        value: "false"
