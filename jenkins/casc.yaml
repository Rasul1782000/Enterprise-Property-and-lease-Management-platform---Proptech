jenkins:
  systemMessage: "Enterprise Property & Lease Management Portal - CI/CD Server"
  numExecutors: 2
  mode: NORMAL
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "admin"
          name: "Administrator"
          password: "admin123"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

unclassified:
  location:
    url: "http://localhost:8888/"
    adminAddress: "admin@localhost"

jobs:
  - script: >
      pipelineJob('enterprise-property-portal') {
        definition {
          cpsScm {
            scm {
              git {
                remote {
                  url('https://github.com/Rasul1782000/Enterprise-Property-and-lease-Management-Portal.git')
                }
                branches('*/main')
              }
            }
            scriptPath('Jenkinsfile')
          }
        }
        triggers {
          /*
           * Periodic poll cadence.
           *
           * IMPORTANT: Jenkins cron has a one-minute floor. There is no
           * second-level granularity in the syntax, so a 12-second trigger
           * cannot be expressed here. `* * * * *` is the fastest this can
           * possibly poll: once per minute.
           *
           * A trigger that fires while a build is already running is dropped,
           * not queued (the pipeline sets `disableConcurrentBuilds()`), so a
           * one-minute cadence against multi-minute builds means Jenkins
           * simply keeps one build in flight and re-polls right after it
           * finishes. That is the closest useful behaviour to what was asked.
           *
           * `H/5` would spread the poll across the five minutes instead of
           * firing on the minute boundary, which matters once several agents
           * share the controller. That trade-off is not worth it while
           * shaking the pipeline down, so the exact `* * * * *` is used here.
           */
          scm('* * * * *')
        }
      }
