[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisord.log
logfile_maxbytes=50MB
logfile_backups=10
loglevel=info
pidfile=/var/run/supervisord.pid

[program:php-fpm]
command=php-fpm -F
; Run the php-fpm *master* as root, exactly like the upstream php:fpm image.
; The master needs root to open its error log (/proc/self/fd/2) and to write
; /usr/local/var/run/php-fpm.pid. The pool config (www.conf) drops the worker
; processes to www-data, so requests still run unprivileged. Running the master
; as www-data fails at startup with "failed to open error_log ... Permission
; denied" and php-fpm exits 78 (EX_CONFIG).
user=root
autostart=true
autorestart=true
stdout_logfile=/var/log/php-fpm.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10
stderr_logfile=/var/log/php-fpm-error.log
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=10

[program:nginx]
command=nginx -g "daemon off;"
user=root
autostart=true
autorestart=true
stdout_logfile=/var/log/nginx.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10
stderr_logfile=/var/log/nginx-error.log
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=10